[package]
name = "voice-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Compatibility feature name: the desktop currently enables `whisper`, but the
# runtime now uses Vietnamese Zipformer through sherpa-onnx as the primary ASR
# engine and retains whisper-rs only as a local fallback.
whisper = ["dep:whisper-rs", "dep:sherpa-onnx"]
wake-sherpa = ["dep:sherpa-onnx", "dep:sentencepiece"]

[dependencies]
async-trait.workspace = true
cpal.workspace = true
sentencepiece = { workspace = true, optional = true, features = ["static"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
sherpa-onnx = { version = "1.13.7", optional = true, default-features = false, features = ["shared"] }
whisper-rs = { version = "0.16.0", optional = true, default-features = false, features = ["tracing_backend"] }
windows = { workspace = true, features = [
    "Win32_Media_Speech",
    "Win32_System_Com",
] }
