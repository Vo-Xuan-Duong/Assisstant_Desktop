[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/common",
    "crates/assistant-core",
    "crates/antigravity-bridge",
    "crates/context-engine",
    "crates/permission-broker",
    "crates/permission-engine",
    "crates/voice-runtime",
    "crates/windows-tools",
    "crates/windows-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Vo-Xuan-Duong/Assisstant_Desktop"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.18.2"
crossterm = "0.28"
png = "0.18"
ratatui = "0.29"
reqwest = { version = "0.13.4", default-features = true }
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
sentencepiece = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows = "0.62.2"
