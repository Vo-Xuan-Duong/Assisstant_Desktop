[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/common",
    "crates/assistant-core",
    "crates/antigravity-bridge",
    "crates/windows-tools",
    "crates/windows-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Vo-Xuan-Duong/Assisstant_Desktop"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows = "0.62.2"
