[package]
name = "assisstant-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
voice-whisper = ["voice-runtime/whisper"]
wake-word = ["voice-runtime/wake-sherpa"]

[lib]
name = "assisstant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "assisstant-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
antigravity-bridge = { path = "../../../crates/antigravity-bridge" }
assistant-common = { path = "../../../crates/common" }
assistant-core = { path = "../../../crates/assistant-core" }
context-engine = { path = "../../../crates/context-engine" }
permission-broker = { path = "../../../crates/permission-broker" }
voice-runtime = { path = "../../../crates/voice-runtime" }
windows-tools = { path = "../../../crates/windows-tools" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
