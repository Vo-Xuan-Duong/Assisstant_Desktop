[package]
name = "assisstant-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "assisstant-desktop"

[features]
default = []
# Historical desktop feature retained so existing cfg blocks and release config stay valid.
# It now enables Zipformer only; whisper-rs is not part of normal desktop builds.
voice-whisper = ["voice-runtime/zipformer"]
# Preferred feature name for new build commands. Enabling it also enables the historical
# desktop cfg surface so the current Tauri voice lifecycle remains compiled.
voice-stt = ["voice-whisper"]
wake-word = ["voice-runtime/wake-sherpa"]

[lib]
name = "assisstant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "assisstant-desktop"
path = "src/main.rs"

[[bin]]
name = "assistant"
path = "src/bin/assistant.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
antigravity-bridge = { path = "../../../crates/antigravity-bridge" }
assistant-common = { path = "../../../crates/common" }
assistant-core = { path = "../../../crates/assistant-core" }
context-engine = { path = "../../../crates/context-engine" }
permission-broker = { path = "../../../crates/permission-broker" }
permission-engine = { path = "../../../crates/permission-engine" }
voice-runtime = { path = "../../../crates/voice-runtime" }
windows-tools = { path = "../../../crates/windows-tools" }
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
