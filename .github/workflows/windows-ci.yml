name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows test and compile
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt

      # Temporary, read-only source capture used to repair repository-wide
      # rustfmt debt with the exact toolchain enforced by this workflow.
      # The generated files are uploaded as an artifact and this block is
      # removed once the formatting-only source commit is materialized.
      - name: Generate Rust formatting snapshot
        shell: powershell
        run: |
          cargo fmt --all
          $files = @(git diff --name-only -- '*.rs')
          $snapshot = Join-Path $PWD 'target\rustfmt-output'
          New-Item -ItemType Directory -Force -Path $snapshot | Out-Null
          foreach ($file in $files) {
            $destination = Join-Path $snapshot $file
            $parent = Split-Path -Parent $destination
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            Copy-Item -LiteralPath $file -Destination $destination -Force
          }
          $files | Set-Content -Path (Join-Path $snapshot 'rustfmt-files.txt') -Encoding utf8
          Write-Host "Captured $($files.Count) rustfmt-changed source files."

      - name: Upload Rust formatting snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output-${{ github.sha }}
          path: target/rustfmt-output
          if-no-files-found: error
          retention-days: 1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Materialize release assets
        shell: powershell
        run: pnpm desktop:assets:prepare

      - name: Prepare native build dependencies
        run: pnpm desktop:native:prepare

      - name: Stage MCP sidecar
        run: pnpm --dir apps/desktop sidecar:stage:dev

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-native.ps1 -Mode test

      - name: Build frontend
        run: pnpm --filter @assisstant/desktop build

      - name: Check full desktop feature set
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-native.ps1 -Mode check

      - name: Verify release contract
        shell: powershell
        run: pnpm desktop:release:verify
