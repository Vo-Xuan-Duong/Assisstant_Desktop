name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Temporary write permission is constrained by the auto-format step below to
# this repository's own PR #101 branch. It is restored to contents: read as
# soon as the formatting-only commit has been created.
permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows test and compile
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Apply workspace rustfmt cleanup
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 101 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'fix/ci-sidecar-staging-order'
        shell: powershell
        run: |
          cargo fmt --all
          git diff --quiet -- '*.rs'
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Workspace Rust sources are already formatted.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git diff failed with exit code $LASTEXITCODE"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply workspace rustfmt'
          git push origin "HEAD:$env:GITHUB_HEAD_REF"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Materialize release assets
        shell: powershell
        run: pnpm desktop:assets:prepare

      - name: Prepare native build dependencies
        run: pnpm desktop:native:prepare

      - name: Stage MCP sidecar
        run: pnpm --dir apps/desktop sidecar:stage:dev

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-native.ps1 -Mode test

      - name: Build frontend
        run: pnpm --filter @assisstant/desktop build

      - name: Check full desktop feature set
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-native.ps1 -Mode check

      - name: Verify release contract
        shell: powershell
        run: pnpm desktop:release:verify
