name: Android CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android-satellite/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-satellite/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Android lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/android-satellite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android-satellite/*.gradle.kts
            apps/android-satellite/gradle.properties
            apps/android-satellite/app/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Lint Android app
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-satellite-debug-${{ github.sha }}
          path: apps/android-satellite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
